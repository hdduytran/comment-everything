<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme landing page</title>
    <style>
      body {
        font:
          16px/1.6 system-ui,
          sans-serif;
        margin: 0;
        color: #1e293b;
        background: #f8fafc;
      }
      header {
        padding: 48px 56px 32px;
        background: linear-gradient(135deg, #e0e7ff, #fae8ff);
      }
      h1 {
        font-size: 34px;
        margin: 0 0 8px;
      }
      header p {
        margin: 0 0 20px;
        max-width: 34rem;
      }
      button {
        font: inherit;
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
      }
      ul {
        display: flex;
        gap: 16px;
        list-style: none;
        padding: 24px 56px;
        margin: 0;
      }
      li {
        flex: 1;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="headline">Ship faster with Acme</h1>
      <p id="subhead">Acme helps teams plan, build and release software without the busywork.</p>
      <button id="cta">Get started</button>
    </header>
    <ul>
      <li id="plan">Plan: roadmaps that stay honest.</li>
      <li id="build">Build: previews on every branch.</li>
      <li id="ship">Ship: one-click rollbacks.</li>
    </ul>
  </body>
</html>
